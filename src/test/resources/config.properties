# Base URLs of the systems under test
base.uri=https://petstore.swagger.io/v2
heroku.url=https://the-internet.herokuapp.com

# Browser settings (override with -Dbrowser=firefox -Dheadless=false)
browser=chrome
headless=true
implicit.wait.seconds=0
explicit.wait.seconds=15
page.load.timeout.seconds=60

# Petstore API paths (relative to base.uri)
pet.file.bodies.root=src/test/resources/data-files/backend/
